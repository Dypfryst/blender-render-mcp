name: Test og bygg

# Enhetstester kjører ved hver push og pull request.
# Imaget bygges og testes på main, og publiseres til ghcr.io når en versjon tagges (v0.1.0).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/dypfryst/blender-render-mcp

jobs:
  enhetstester:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Installer ffmpeg og oiiotool
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg openimageio-tools
      - name: Installer Python-pakker
        run: pip install -r requirements-dev.txt
      - name: Kjør enhetstester
        run: python -m pytest -v

  image:
    needs: enhetstester
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Bygg imaget
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: blender-render-mcp:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Kjør alle tester inne i imaget med ekte Blender (på prosessoren)
        run: |
          docker run --rm -v "$PWD/tests:/app/tests:ro" -e BLENDER_TEST=blender -e ALLOW_CPU=true \
            --entrypoint sh blender-render-mcp:test -c \
            "/opt/venv/bin/pip install -q pytest==9.1.1 httpx==0.28.1 && cd /app && /opt/venv/bin/python -m pytest -v -p no:cacheprovider tests"

      - name: Sjekk at containeren starter og krever nøkkel
        run: |
          mkdir -p /tmp/data /tmp/config && chmod 777 /tmp/data /tmp/config
          docker run -d --name rendertest -p 8765:8765 -e MCP_TOKEN=testnokkel-som-er-lang-nok \
            -v /tmp/data:/data -v /tmp/config:/config blender-render-mcp:test
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8765/mcp && break; sleep 1; done
          docker logs rendertest
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8765/mcp)" = "401"
          svar=$(curl -s -X POST http://localhost:8765/mcp \
            -H "Authorization: Bearer testnokkel-som-er-lang-nok" \
            -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" \
            -H "MCP-Protocol-Version: 2025-06-18" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"helse","arguments":{}}}')
          echo "$svar"
          echo "$svar" | grep -q "Blender 5.2"
          docker rm -f rendertest

      - name: Versjonsnavn for imaget
        if: startsWith(github.ref, 'refs/tags/v')
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: latest=true

      - name: Logg inn på ghcr.io
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publiser til ghcr.io
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
